name: PIMCAT H2 protected gap study
on:
  pull_request:
    paths:
      - 'backend/src/benchmarking/pimcat_h2_gap.py'
      - 'backend/tests/test_pimcat_h2_gap.py'
      - 'docs/pimcat/h2-gap-protocol.md'
      - '.github/workflows/pimcat-h2-sumo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gap-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PIMCAT_H2_SUMO_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --only-binary=:all: eclipse-sumo==1.24.0 libsumo==1.24.0 sumolib==1.24.0 traci==1.24.0
          python -c "import sumo; print('SUMO_HOME='+sumo.SUMO_HOME)" >> "$GITHUB_ENV"
          mkdir -p /tmp/pimcat-h2
          python -m pip freeze > /tmp/pimcat-h2/environment.txt
      - name: Run microscopic and previous protection regressions
        working-directory: backend
        run: python -m pytest -q tests/test_pimcat_h2_gap.py tests/test_pimcat_midblock.py tests/test_pimcat_local.py tests/test_pimcat_d_sumo.py --junitxml=/tmp/pimcat-h2/tests.xml
      - name: Run preregistered campaign
        working-directory: backend
        run: python -m src.benchmarking.pimcat_h2_gap --output /tmp/pimcat-h2/study.json
      - name: Verify research accounting and non-promotion
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from src.archive.store import fingerprint
          d=json.load(open('/tmp/pimcat-h2/study.json'));sha=d.pop('result_sha256')
          assert fingerprint(d)==sha and d['cases']==24 and d['trajectories']==96
          assert d['c3_independent_precision']=='BLOCKED_BY_INDEPENDENT_ANNOTATION' and d['operational_decision']=='abstain'
          assert not any(d[k] for k in ('physical_actuation','candidate_promoted','operationally_validated','commercial_demo_authorized'))
          for row in d['rows']:
              assert row['conflicts_verified']
              for m in row['metrics'].values():
                  assert row['conflicts_verified'] and m['runtime_version'].split()[-1]=='1.24.0'
                  assert m['vehicles_scheduled']==m['vehicles_exited']+m['vehicles_remaining']+m['vehicles_uninserted']
                  assert m['pedestrians_scheduled']==m['pedestrians_exited']+m['pedestrians_remaining']+m['pedestrians_uninserted']
                  assert m['pedestrians_admitted']==m['pedestrians_completed']+m['pedestrians_crossing']
                  assert not any(m[k] for k in ('red_entries','conflict_violations','colliding_vehicle_events','overspeed_samples','teleports'))
          print(json.dumps(d['gates'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pimcat-h2-evidence
          path: /tmp/pimcat-h2/
          retention-days: 30
