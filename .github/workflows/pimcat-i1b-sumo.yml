name: PIMCAT I1B calibrated ETA corridor study
on:
  pull_request:
    paths:
      - 'backend/src/benchmarking/pimcat_i1b_eta.py'
      - 'backend/src/benchmarking/pimcat_d_sumo.py'
      - 'backend/tests/test_pimcat_i1b_eta.py'
      - 'docs/pimcat/i1b-eta-protocol.md'
      - '.github/workflows/pimcat-i1b-sumo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eta-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    env:
      PIMCAT_D_SUMO_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --only-binary=:all: eclipse-sumo==1.24.0 libsumo==1.24.0 sumolib==1.24.0 traci==1.24.0
          python -c "import sumo; print('SUMO_HOME='+sumo.SUMO_HOME)" >> "$GITHUB_ENV"
          mkdir -p /tmp/pimcat-i1b
          python -m pip freeze > /tmp/pimcat-i1b/environment.txt
      - name: Original corridor protection and calibration regression
        run: python -m pytest -q tests/test_pimcat_i1b_eta.py tests/test_pimcat_d_sumo.py tests/test_pimcat_midblock.py tests/test_pimcat_local.py tests/test_pimcat_i1a_advance_only.py tests/test_pimcat_h2_gap.py --junitxml=/tmp/pimcat-i1b/tests.xml
      - name: Train and evaluate on disjoint preregistered seeds
        run: python -m src.benchmarking.pimcat_i1b_eta --output /tmp/pimcat-i1b/study.json
      - name: Verify accounting and frozen model and preserve scientific outcome
        run: |
          python - <<'PY'
          import json
          from src.benchmarking.pimcat_i1b_eta import verify
          with open('/tmp/pimcat-i1b/study.json') as f:d=json.load(f)
          print(json.dumps(verify(d),sort_keys=True))
          print(json.dumps(d['eta_details'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pimcat-i1b-evidence
          path: /tmp/pimcat-i1b/
          retention-days: 30
