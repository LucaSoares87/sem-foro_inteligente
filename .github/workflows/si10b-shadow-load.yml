name: FR-PERF-02C screening (isolated)
on:
  workflow_dispatch:
    inputs:
      authorize_screening:
        description: 'Authorize one FR-PERF-02C screening, maximum 25 job-min'
        type: boolean
        required: true
        default: false
      authorize_holdout_transfer:
        description: 'Authorize only the two pinned Bellevue holdouts after fixtures pass'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
jobs:
  fixtures:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/fr-perf-02c-screening' && inputs.authorize_screening == true && inputs.authorize_holdout_transfer == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - name: Verify and unpack research-only overlays
        run: |
          set -euo pipefail
          mkdir -p /tmp/fr02c-fixture-evidence
          printf '%s\n' "$GITHUB_SHA" > /tmp/fr02c-fixture-evidence/revision.txt
          echo '52b5fb87ac2dc76a0899fcd9e65881a2f3776048d6d578fc010c70081dea9ef9  research/fr-perf-02b/overlay.tar.gz' | sha256sum -c -
          tar -xzf research/fr-perf-02b/overlay.tar.gz --keep-old-files
          sha256sum -c research/fr-perf-02b/overlay.sha256
          cat research/fr-perf-02c/overlay.part-* > /tmp/fr02c-fixture-overlay.tar.gz
          echo '81b6deb3b63a6f6dbf0c08d562f2cbcf0b9441a8f5c3392809b0ab6cc780529a  /tmp/fr02c-fixture-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/fr02c-fixture-overlay.tar.gz --keep-old-files
          sha256sum -c research/fr-perf-02c/overlay.sha256
          git diff --exit-code
      - name: Install pinned isolated environments and retrieve existing model only
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout 300s bash research/fr-perf-02c/setup.sh /tmp/fr02c-fixture /tmp/fr02c-fixture-evidence
      - name: Mandatory regression fixtures
        run: PYTHONPATH=backend:scripts timeout 60s /tmp/fr02c-fixture/infer/bin/python -m pytest -q backend/tests/test_fr_perf_02b.py backend/tests/test_fr_perf_02c.py scripts/test_lock_from_report.py --junitxml=/tmp/fr02c-fixture-evidence/fixtures.xml
      - name: Mandatory real plain and instrumented worker fixtures (no Bellevue)
        working-directory: backend
        run: timeout 120s /tmp/fr02c-fixture/infer/bin/python -m src.benchmarking.fr_perf_02c_fixtures --lock ../research/fr-perf-02c/requirements.lock --acquisition-lock ../research/fr-perf-02c/acquisition.lock --inputs ../research/fr-perf-02c/input-hashes.json --junit /tmp/fr02c-fixture-evidence/fixtures.xml --model-spec /tmp/fr02c-fixture/model/yolox_s.model-spec.json --model-root /tmp/fr02c-fixture/model --output /tmp/fr02c-fixture-evidence/fixture-proof.json
      - name: Preserve fixture evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-perf-02c-fixtures
          path: /tmp/fr02c-fixture-evidence/
          if-no-files-found: error
          retention-days: 30
  screening:
    needs: fixtures
    if: needs.fixtures.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/fr-perf-02c-screening' && inputs.authorize_screening == true && inputs.authorize_holdout_transfer == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - name: Verify and unpack research-only overlays
        run: |
          set -euo pipefail
          mkdir -p /tmp/fr02c-evidence
          printf '%s\n' "$GITHUB_SHA" > /tmp/fr02c-evidence/revision.txt
          echo '52b5fb87ac2dc76a0899fcd9e65881a2f3776048d6d578fc010c70081dea9ef9  research/fr-perf-02b/overlay.tar.gz' | sha256sum -c -
          tar -xzf research/fr-perf-02b/overlay.tar.gz --keep-old-files
          sha256sum -c research/fr-perf-02b/overlay.sha256
          cat research/fr-perf-02c/overlay.part-* > /tmp/fr02c-screen-overlay.tar.gz
          echo '81b6deb3b63a6f6dbf0c08d562f2cbcf0b9441a8f5c3392809b0ab6cc780529a  /tmp/fr02c-screen-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/fr02c-screen-overlay.tar.gz --keep-old-files
          sha256sum -c research/fr-perf-02c/overlay.sha256
          git diff --exit-code
      - name: Retrieve same-run fixture proof
        uses: actions/download-artifact@v4
        with:
          name: fr-perf-02c-fixtures
          path: /tmp/fr02c-proof
      - name: Prepare environment, verify gate, then acquire only pinned holdouts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 300s bash -euo pipefail <<'SETUP'
          bash research/fr-perf-02c/setup.sh /tmp/fr02c-screen /tmp/fr02c-evidence
          bash research/fr-perf-02c/screening.sh
          SETUP
      - name: Run only the preregistered screening
        working-directory: backend
        run: timeout 480s /tmp/fr02c-screen/infer/bin/python -m src.benchmarking.fr_perf_02c --authorize-screening --authorize-holdout-transfer --lock ../research/fr-perf-02c/requirements.lock --acquisition-lock ../research/fr-perf-02c/acquisition.lock --inputs ../research/fr-perf-02c/input-hashes.json --fixture-proof /tmp/fr02c-proof/fixture-proof.json --model-spec /tmp/fr02c-screen/model/yolox_s.model-spec.json --model-root /tmp/fr02c-screen/model --holdouts /tmp/fr02c-screen/holdouts --output /tmp/fr02c-evidence/results
      - name: Remove private inputs
        if: always()
        run: rm -rf /tmp/fr02c-screen/holdouts /tmp/fr02c-screen/model /tmp/fr02c-screen/model.zip
      - name: Preserve screening evidence including negative and partial outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-perf-02c-evidence
          path: /tmp/fr02c-evidence/
          if-no-files-found: error
          retention-days: 30
