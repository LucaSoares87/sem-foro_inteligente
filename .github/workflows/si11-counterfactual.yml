name: SI-11 synthetic counterfactual
on:
  pull_request:
    paths:
      - 'backend/src/benchmarking/si11_counterfactual.py'
      - 'backend/tests/test_si11_counterfactual.py'
      - '.github/workflows/si11-counterfactual.yml'
      - 'docs/si11/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-study:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing runtime
        run: python -m pip install -r requirements-dev.txt
      - name: Validate conservation, reproducibility and abstention
        run: python -m pytest -q tests/test_si11_counterfactual.py
      - name: Execute independent synthetic study
        run: |
          mkdir -p /tmp/si11-results
          python -m src.benchmarking.si11_counterfactual --output /tmp/si11-results/counterfactual.json
      - name: Verify report integrity and synthetic-only boundaries
        run: |
          python - <<'PY'
          import json
          from src.archive.store import fingerprint
          d=json.load(open('/tmp/si11-results/counterfactual.json'))
          b=dict(d); sha=b.pop('result_sha256')
          assert sha==fingerprint(b)
          assert d['scope']=='synthetic_counterfactual_not_field'
          assert all(d[k] is False for k in ('x_validated_for_real_traffic','candidate_promoted','commercial_demo_authorized','operationally_validated','physical_actuation'))
          assert d['low_confidence_abstention_verified']
          assert len(d['cases'])==320
          assert sum(len(c['metrics']) for c in d['cases'])==1600
          print(json.dumps(d['overall'],indent=2))
          PY
      - name: Preserve synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: si11-synthetic-counterfactual-evidence
          path: /tmp/si11-results/counterfactual.json
          if-no-files-found: error
          retention-days: 30
