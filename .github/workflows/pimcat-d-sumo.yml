name: PIMCAT D dynamic green wave
on:
  pull_request:
    paths:
      - 'backend/src/benchmarking/pimcat_d_sumo.py'
      - 'backend/tests/test_pimcat_d_sumo.py'
      - 'docs/pimcat/d-green-wave-protocol.md'
      - '.github/workflows/pimcat-d-sumo.yml'
  push:
    branches: [main]
    paths:
      - 'backend/src/benchmarking/pimcat_d_sumo.py'
      - 'backend/tests/test_pimcat_d_sumo.py'
      - 'docs/pimcat/d-green-wave-protocol.md'
      - '.github/workflows/pimcat-d-sumo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corridor-study:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      PIMCAT_D_SUMO_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned research runtime
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --only-binary=:all: eclipse-sumo==1.24.0 libsumo==1.24.0 sumolib==1.24.0 traci==1.24.0
          python -c "import sumo; print('SUMO_HOME='+sumo.SUMO_HOME)" >> "$GITHUB_ENV"
      - name: Verify environment
        run: |
          mkdir -p /tmp/pimcat-d
          python -c "from src.benchmarking.si11d_sumo import ensure_version; ensure_version()"
          python -m pip freeze > /tmp/pimcat-d/environment.txt
      - name: Test actual networks and previous multimodal invariants
        run: python -m pytest -q tests/test_pimcat_d_sumo.py tests/test_pimcat_midblock.py tests/test_pimcat_local.py tests/test_pimcat_c3_vision.py tests/test_queue_optimization.py
      - name: Run preregistered corridor study
        run: python -m src.benchmarking.pimcat_d_sumo --output /tmp/pimcat-d/study.json
      - name: Check accounting, version and evidence boundaries
        run: |
          python - <<'PY'
          import json
          from src.archive.store import fingerprint
          d=json.load(open('/tmp/pimcat-d/study.json'));sha=d.pop('result_sha256')
          assert fingerprint(d)==sha and d['cases']==32 and d['trajectories']==128
          assert d['sumo_version']=='1.24.0' and d['seeds']==list(range(8100,8104))
          assert d['c3_independent_precision']=='BLOCKED_BY_INDEPENDENT_ANNOTATION'
          assert d['operational_decision']=='abstain'
          assert all(d[k] is False for k in ('candidate_promoted','operationally_validated','physical_actuation','commercial_demo_authorized'))
          assert len(d['rows'])==32
          for row in d['rows']:
              assert row['conflicts_verified'] and len(row['metrics'])==4
              for m in row['metrics'].values():
                  assert m['runtime_version'].split()[-1]=='1.24.0'
                  assert m['vehicle_scheduled']==m['vehicle_exited']+m['vehicle_remaining']+m['vehicle_uninserted']
                  assert m['pedestrian_scheduled']==m['pedestrian_exited']+m['pedestrian_remaining']+m['pedestrian_uninserted']
                  assert m['pedestrian_admitted']==m['pedestrian_completed']+m['pedestrian_crossing']
                  assert m['eta_issued']==m['eta_arrived']+m['eta_censored']
                  assert m['vehicle_area']==m['corridor_vehicle_area']+m['transverse_vehicle_area']
                  assert abs(m['critical_exposure']-sum(m['segment_critical_exposure']))<1e-7
                  assert m['mid_empty_interruptions']==0
                  assert not any(m[k] for k in ('collisions','teleports','overspeed_samples','conflict_violations','red_entries'))
          print(json.dumps(d['gates'],sort_keys=True))
          PY
      - name: Preserve research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pimcat-d-evidence
          path: /tmp/pimcat-d/
          retention-days: 30
          if-no-files-found: warn
