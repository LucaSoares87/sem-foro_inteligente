name: I1G wheelhouse validation
on:
  push:
    branches: [research/i1g-wheelhouse-once]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.created && github.run_attempt == 1 && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify frozen PyPI wheels and dependency closure
        run: /usr/bin/python3.12 research/i1g-wheelhouse/verify.py
