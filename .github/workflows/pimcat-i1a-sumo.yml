name: PIMCAT I1A advance-only research
on:
  pull_request:
    paths:
      - 'backend/src/benchmarking/pimcat_i1a_advance_only.py'
      - 'backend/src/benchmarking/pimcat_h2_gap.py'
      - 'backend/tests/test_pimcat_i1a_advance_only.py'
      - 'docs/pimcat/i1a-advance-only-protocol.md'
      - '.github/workflows/pimcat-i1a-sumo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advance-only-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIMCAT_I1A_SUMO_REQUIRED: '1'
      PIMCAT_H2_SUMO_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --only-binary=:all: eclipse-sumo==1.24.0 libsumo==1.24.0 sumolib==1.24.0 traci==1.24.0
          python -c "import sumo; print('SUMO_HOME='+sumo.SUMO_HOME)" >> "$GITHUB_ENV"
          mkdir -p /tmp/pimcat-i1a
          python -m pip freeze > /tmp/pimcat-i1a/environment.txt
      - name: Run original protection and new parity and counterfactual tests
        working-directory: backend
        run: python -m pytest -q tests/test_pimcat_i1a_advance_only.py tests/test_pimcat_h2_gap.py tests/test_pimcat_midblock.py tests/test_pimcat_local.py --junitxml=/tmp/pimcat-i1a/tests.xml
      - name: Execute preregistered 120-trajectory campaign
        working-directory: backend
        run: python -m src.benchmarking.pimcat_i1a_advance_only --output /tmp/pimcat-i1a/study.json
      - name: Verify result and record scientific outcome without promotion
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from src.benchmarking.pimcat_i1a_advance_only import verify
          with open('/tmp/pimcat-i1a/study.json') as f:
              d=json.load(f)
          print(json.dumps(verify(d),sort_keys=True))
          print(json.dumps(d['paired_differences'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pimcat-i1a-evidence
          path: /tmp/pimcat-i1a/
          retention-days: 30
