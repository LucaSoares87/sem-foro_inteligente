name: PIMCAT G research acceptance
on:
  pull_request:
    paths:
      - 'docs/pimcat/g-*'
      - 'backend/tests/test_pimcat_g_acceptance.py'
      - 'ops/pimcat_g_scorecard.py'
      - '.github/workflows/pimcat-g-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'docs/pimcat/g-*'
      - 'backend/tests/test_pimcat_g_acceptance.py'
      - 'ops/pimcat_g_scorecard.py'
      - '.github/workflows/pimcat-g-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  multimodal-regression:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PIMCAT_C2_SUMO_REQUIRED: '1'
      PIMCAT_D_SUMO_REQUIRED: '1'
      PIMCAT_E_SUMO_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing dependencies and pinned SUMO
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --only-binary=:all: eclipse-sumo==1.24.0 libsumo==1.24.0 sumolib==1.24.0 traci==1.24.0
          python -c "import sumo; print('SUMO_HOME='+sumo.SUMO_HOME)" >> "$GITHUB_ENV"
          mkdir -p /tmp/pimcat-g
          python -m pip freeze > /tmp/pimcat-g/environment.txt
      - name: Run exact 27 scenarios and original multimodal regression
        working-directory: backend
        run: |
          python -m pytest -q tests/test_pimcat_g_acceptance.py tests/test_pimcat_local.py tests/test_pimcat_midblock.py tests/test_pimcat_c2_sumo.py tests/test_pimcat_c3_vision.py tests/test_pimcat_d_sumo.py tests/test_pimcat_e_global.py tests/test_pimcat_f_daily.py tests/test_queue_optimization.py tests/test_si13_current_optimization.py tests/test_si13_field_packet.py --junitxml=/tmp/pimcat-g/regression.xml
      - name: Verify nine original scientific reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pimcat-g-sources
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('frontend/src/app/pimcatEvidence.json').read_text())
          with open('/tmp/pimcat-g-sources/manifest.tsv','w') as f:
              for s in d['studies']:
                  assert s['key'] in ('si11a','si11b','si11c','si11d','c1','c2','c3','d','e')
                  assert type(s['artifact']) is int
                  f.write(f"{s['key']}\t{s['artifact']}\n")
          PY
          while IFS=$'\t' read -r key id; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "/tmp/pimcat-g-sources/pimcat-f-$key.zip"
          done < /tmp/pimcat-g-sources/manifest.tsv
          python backend/scripts/verify_pimcat_f_evidence.py /tmp/pimcat-g-sources | tee /tmp/pimcat-g/provenance.txt
      - name: Generate bounded research acceptance scorecard
        run: |
          python ops/pimcat_g_scorecard.py --junit /tmp/pimcat-g/regression.xml --revision "$(git rev-parse HEAD)" --output /tmp/pimcat-g/scorecard.json
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('/tmp/pimcat-g')
          a=json.loads((root/'scorecard.json').read_text())
          assert len(a['scenarios'])==27 and a['human_acceptance']=='PENDING_HUMAN'
          assert a['pilot_decision']=='blocked_by_field_evidence' and a['physical_actuation'] is False
          assert a['candidate_promoted'] is False
          manifest=[{'file':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.iterdir()) if p.is_file()]
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pimcat-g-research-acceptance
          path: /tmp/pimcat-g/
          if-no-files-found: warn
          retention-days: 30
