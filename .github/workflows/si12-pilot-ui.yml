name: SI-12 pilot product browser
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'docs/si12/**'
      - '.github/workflows/si12-pilot-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-demo:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Playwright 1.51.1 supports Ubuntu 24.04; avoid floating runner OS upgrades.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: si12_ephemeral_ci_only
      APP_ENV: development
      AUTH_MODE: disabled
      VIDEO_SOURCES_JSON: '[]'
      VISION_MODEL_JSON: ''
      TRAFFIC_GEOMETRY_JSON: '[]'
      INTERSECTION_REGISTRY_JSON: '[]'
      VALIDATION_EVIDENCE_JSON: '[]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and test existing frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
          npm install --no-save --package-lock=false playwright@1.51.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start real application with empty field evidence
        run: |
          docker compose up --build --wait --wait-timeout 180
          curl --fail --retry 5 http://127.0.0.1:5173/api/v1/health
      - name: Execute actual browser demo and failure-state checks
        working-directory: frontend
        run: node tests/pilot-browser.mjs
      - name: Archive screenshots and browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: si12-browser-evidence
          path: /tmp/si12-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Tear down isolated environment
        if: always()
        run: |
          docker compose logs --no-color --tail=80
          docker compose down -v
