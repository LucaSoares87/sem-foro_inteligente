name: Foundation CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: traffic_test
          POSTGRES_USER: traffic
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U traffic -d traffic_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://traffic:ci_ephemeral_only@127.0.0.1:5432/traffic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m compileall -q src tests
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q --cov=src.pipeline --cov-report=term-missing --cov-fail-under=90
      - run: python -m pytest -q tests/test_tracking.py --cov=src.tracking.tracker --cov=src.tracking.association --cov-report=term-missing --cov-fail-under=90
      - run: python -m pytest -q tests/test_analytics.py --cov=src.analytics.engine --cov=src.analytics.geometry --cov-report=term-missing --cov-fail-under=90
      - run: python -m pytest -q tests/test_predictive.py --cov=src.predictive.aggregation --cov=src.predictive.forecast --cov-report=term-missing --cov-fail-under=90
      - run: python -m pytest -q tests/test_decision.py --cov=src.decision.engine --cov=src.decision.service --cov-report=term-missing --cov-fail-under=90
      - run: python -m pytest -q tests/test_queue_optimization.py --cov=src.queueing.engine --cov=src.optimization.engine --cov-report=term-missing --cov-fail-under=90
      - run: python -m pytest -q tests/test_geography.py tests/test_history_view.py tests/test_operations.py tests/test_validation.py tests/test_benchmarking.py
      - run: alembic upgrade head && alembic check
      - run: alembic downgrade base && alembic upgrade head
      - run: ARCHIVE_POSTGRES_TEST=1 python -m pytest -q tests/test_archive_postgres.py tests/test_history_postgres.py
      - run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from src.main import app
          with TestClient(app) as c:
              response = c.get('/health')
              assert response.status_code == 200, response.text
              assert response.json()['schema'] == 'current'
          PY
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci_ephemeral_only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: sh -n ops/backup.sh && sh -n ops/restore.sh
      - run: python3 -m py_compile ops/smoke_load.py ops/pilot_probe.py ops/recovery_drill.py
      - run: docker compose up --build --wait --wait-timeout 180
      - run: docker compose exec -T backend python -c 'import cv2; import numpy; print(cv2.__version__)'
      - run: test "$(docker compose exec -T backend id -u | tr -d '\r')" != "0"
      - run: test "$(docker compose exec -T frontend id -u | tr -d '\r')" != "0"
      - run: |
          curl --fail --retry 5 http://127.0.0.1:5173/
          curl --fail http://127.0.0.1:5173/executivo
          curl --fail 'http://127.0.0.1:5173/operacional?intersection=CR_01'
          curl --fail http://127.0.0.1:5173/laboratorio
          curl --fail http://127.0.0.1:5173/videowall
          curl --fail http://127.0.0.1:5173/apresentacao
          curl --fail http://127.0.0.1:5173/homologacao
          curl --fail http://127.0.0.1:5173/api/v1/health
          curl --fail http://127.0.0.1:5173/api/v1/intersections
          curl --fail http://127.0.0.1:5173/api/v1/operations/status
          curl --fail http://127.0.0.1:5173/api/v1/operations/metrics
          curl --fail http://127.0.0.1:5173/api/v1/validation/status
          curl --fail http://127.0.0.1:5173/api/v1/queue/status
          curl --fail http://127.0.0.1:5173/api/v1/optimization/status
          curl -fsSI http://127.0.0.1:5173/executivo | grep -qi '^Content-Security-Policy:'
          curl -fsSI http://127.0.0.1:5173/executivo | grep -qi '^Permissions-Policy:'
          python3 ops/smoke_load.py --url http://127.0.0.1:5173/api/v1/health --requests 80 --concurrency 8 --p95-ms 5000
          mkdir -p .ci-backups
          python3 ops/pilot_probe.py --base-url http://127.0.0.1:5173 --samples 3 --interval 0.05 --output .ci-backups/pilot-probe.json
          python3 - <<'PY'
          import json
          data=json.load(open('.ci-backups/pilot-probe.json'))
          assert data['evidence_state']=='measured'
          assert data['pilot_gate_satisfied'] is False
          assert data['physical_actuation'] is False
          PY
          python3 ops/recovery_drill.py --base-url http://127.0.0.1:5173 --component backend --max-seconds 60 --output .ci-backups/recovery.json
          python3 - <<'PY'
          import json
          data=json.load(open('.ci-backups/recovery.json'))
          assert data['recovered'] is True
          assert data['pilot_gate_satisfied'] is False
          assert data['physical_actuation'] is False
          PY
          ./ops/backup.sh "$PWD/.ci-backups/ci.dump"
          ./ops/restore.sh "$PWD/.ci-backups/ci.dump" traffic_restore_ci
          test "$(docker compose exec -T -e TARGET_DB=traffic_restore_ci postgres sh -ceu 'psql -U "$POSTGRES_USER" -d "$TARGET_DB" -Atqc "SELECT version_num FROM alembic_version"')" = "0006_queue_optimization"
          docker compose exec -T -e TARGET_DB=traffic_restore_ci postgres sh -ceu 'dropdb -U "$POSTGRES_USER" "$TARGET_DB"'
          rm -rf .ci-backups
          python -m pip install websockets==15.0.1
          python - <<'PY'
          import json
          from websockets.sync.client import connect
          with connect('ws://127.0.0.1:5173/api/v1/ws/realtime',origin='http://127.0.0.1:5173',open_timeout=5) as ws:
              assert json.loads(ws.recv(timeout=5))['type'] == 'connection_ack'
              ws.send('ping')
              assert json.loads(ws.recv(timeout=5))['type'] == 'heartbeat'
          PY
      - if: failure()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down -v
