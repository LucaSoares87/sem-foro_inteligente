name: PIMCAT E global intelligence
on:
  pull_request:
    paths:
      - 'backend/src/benchmarking/pimcat_e_global.py'
      - 'backend/tests/test_pimcat_e_global.py'
      - 'docs/pimcat/e-global-protocol.md'
      - '.github/workflows/pimcat-e-sumo.yml'
  push:
    branches: [main]
    paths:
      - 'backend/src/benchmarking/pimcat_e_global.py'
      - 'backend/tests/test_pimcat_e_global.py'
      - 'docs/pimcat/e-global-protocol.md'
      - '.github/workflows/pimcat-e-sumo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grid-study:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      PIMCAT_E_SUMO_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SUMO
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --only-binary=:all: eclipse-sumo==1.24.0 libsumo==1.24.0 sumolib==1.24.0 traci==1.24.0
          python -c "import sumo; print('SUMO_HOME='+sumo.SUMO_HOME)" >> "$GITHUB_ENV"
      - name: Verify environment
        run: |
          mkdir -p /tmp/pimcat-e
          python -c "from src.benchmarking.si11d_sumo import ensure_version; ensure_version()"
          python -m pip freeze > /tmp/pimcat-e/environment.txt
      - name: Test graph, arbitration, real reproducibility and earlier research
        run: python -m pytest -q tests/test_pimcat_e_global.py tests/test_pimcat_d_sumo.py tests/test_pimcat_midblock.py tests/test_pimcat_local.py tests/test_pimcat_c3_vision.py tests/test_queue_optimization.py
      - name: Run preregistered grid study
        run: python -m src.benchmarking.pimcat_e_global --output /tmp/pimcat-e
      - name: Verify report and boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.archive.store import fingerprint
          root=Path('/tmp/pimcat-e')
          d=json.loads((root/'study.json').read_text());sha=d.pop('result_sha256')
          assert fingerprint(d)==sha and d['cases']==24 and d['trajectories']==96
          assert d['sumo_version']=='1.24.0' and d['seeds']==list(range(9100,9104))
          assert d['c3_independent_precision']=='BLOCKED_BY_INDEPENDENT_ANNOTATION'
          assert d['operational_decision']=='abstain'
          assert all(d[k] is False for k in ('candidate_promoted','operationally_validated','physical_actuation','commercial_demo_authorized'))
          assert len(d['rows'])==24
          for row in d['rows']:
              assert row['conflicts_verified'] and len(row['metrics'])==4
              for p,m in row['metrics'].items():
                  assert m['runtime_version'].split()[-1]=='1.24.0'
                  assert m['vehicle_scheduled']==m['vehicle_exited']+m['vehicle_remaining']+m['vehicle_uninserted']
                  assert m['pedestrian_scheduled']==m['pedestrian_exited']+m['pedestrian_remaining']+m['pedestrian_uninserted']
                  assert m['pedestrian_admitted']==m['pedestrian_completed']+m['pedestrian_crossing']
                  assert not any(m[k] for k in ('collisions','teleports','overspeed_samples','conflict_violations','red_entries','rp07_empty_interruptions'))
                  assert m['fallback_ticks']==(180 if row['family']=='outage' and p.startswith('global') else 0)
          for t in (175,240,305):assert (root/f'heatmap-{t}.svg').is_file()
          print(json.dumps(d['gates'],sort_keys=True))
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pimcat-e-evidence
          path: /tmp/pimcat-e/
          retention-days: 30
          if-no-files-found: warn
