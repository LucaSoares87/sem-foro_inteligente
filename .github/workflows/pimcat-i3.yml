name: PIMCAT I3 continuous intelligence research
on:
  pull_request:
    paths:
      - 'backend/src/benchmarking/pimcat_i3_history.py'
      - 'backend/tests/test_pimcat_i3_history.py'
      - 'docs/pimcat/i3-continuous-protocol.md'
      - '.github/workflows/pimcat-i3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          mkdir -p /tmp/i3
          python -m pip freeze > /tmp/i3/environment.txt
      - name: Verify history, original daily report and perception regressions
        run: python -m pytest -q tests/test_pimcat_i3_history.py tests/test_pimcat_f_daily.py tests/test_pimcat_i2c_validation.py --junitxml=/tmp/i3/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pimcat-i3-history-evidence
          path: /tmp/i3/
          retention-days: 30
