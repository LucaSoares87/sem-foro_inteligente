name: PIMCAT I1C receiving-space grid study
on:
  pull_request:
    paths:
      - 'backend/src/benchmarking/pimcat_i1c_pressure.py'
      - 'backend/src/benchmarking/pimcat_e_global.py'
      - 'backend/tests/test_pimcat_i1c_pressure.py'
      - 'docs/pimcat/i1c-receiving-pressure-protocol.md'
      - '.github/workflows/pimcat-i1c-sumo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grid-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    env:
      PIMCAT_E_SUMO_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --only-binary=:all: eclipse-sumo==1.24.0 libsumo==1.24.0 sumolib==1.24.0 traci==1.24.0
          python -c "import sumo; print('SUMO_HOME='+sumo.SUMO_HOME)" >> "$GITHUB_ENV"
          mkdir -p /tmp/pimcat-i1c
          python -m pip freeze > /tmp/pimcat-i1c/environment.txt
      - name: Test original network protections and research parity
        run: python -m pytest -q tests/test_pimcat_i1c_pressure.py tests/test_pimcat_e_global.py tests/test_pimcat_midblock.py tests/test_pimcat_local.py tests/test_pimcat_i1a_advance_only.py tests/test_pimcat_h2_gap.py tests/test_pimcat_i1b_eta.py tests/test_pimcat_d_sumo.py --junitxml=/tmp/pimcat-i1c/tests.xml
      - name: Run preregistered 144 trajectories
        run: python -m src.benchmarking.pimcat_i1c_pressure --output /tmp/pimcat-i1c
      - name: Verify research accounting and gates without promotion
        run: |
          python - <<'PY'
          import json
          from src.benchmarking.pimcat_i1c_pressure import verify
          with open('/tmp/pimcat-i1c/study.json') as f:d=json.load(f)
          print(json.dumps(verify(d),sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pimcat-i1c-evidence
          path: /tmp/pimcat-i1c/
          retention-days: 30
