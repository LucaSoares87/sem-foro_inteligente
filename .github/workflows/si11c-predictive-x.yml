name: SI-11C predictive X
on:
  pull_request:
    paths:
      - 'backend/src/benchmarking/si11c_predictive_x.py'
      - 'backend/tests/test_si11c_predictive_x.py'
      - '.github/workflows/si11c-predictive-x.yml'
      - 'docs/si11/predictive-x-protocol.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  predictive-study:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing research runtime
        run: python -m pip install -r requirements-dev.txt
      - name: Validate fair budgets, conservation and earlier scientific contracts
        run: python -m pytest -q tests/test_si11c_predictive_x.py tests/test_si11b_robust_x.py tests/test_si11_counterfactual.py
      - name: Execute preregistered multi-cycle study
        run: |
          mkdir -p /tmp/si11c-results
          python -m src.benchmarking.si11c_predictive_x --output /tmp/si11c-results/predictive-x.json
      - name: Verify integrity, accounting and non-promotion
        run: |
          python - <<'PY'
          import json
          from src.archive.store import fingerprint
          d=json.load(open('/tmp/si11c-results/predictive-x.json'))
          body=dict(d); digest=body.pop('result_sha256')
          assert digest==fingerprint(body)
          assert d['scope']=='synthetic_multicycle_not_field'
          assert d['seeds']==list(range(3000,3020))
          assert len(d['cases'])==320
          assert sum(len(c['metrics']) for c in d['cases'])==1920
          assert sum(len(m['plans']) for c in d['cases'] for m in c['metrics'].values())==7680
          assert d['low_confidence_abstention_verified']
          assert d['research_gate_passed']==all(c['all_research_gates_met'] for c in d['cohorts'].values())
          assert d['sumo_validation']=='NOT_RUN'
          assert all(d[k] is False for k in ('candidate_promoted','x_validated_for_real_traffic','commercial_demo_authorized','operationally_validated','physical_actuation'))
          for c in d['cases']:
              assert len({m['arrivals'] for m in c['metrics'].values()})==1
              for m in c['metrics'].values():
                  assert sum(p[0] for p in c['pair'])+m['arrivals']==m['departed']+m['remaining']
                  assert sum(m['service_opportunity_ticks'])==208
                  assert min(m['service_opportunity_ticks'])>=48
          print(json.dumps({'research_gate_passed':d['research_gate_passed'],'cohorts':d['cohorts']},indent=2))
          PY
      - name: Preserve complete synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: si11c-predictive-x-evidence
          path: /tmp/si11c-results/predictive-x.json
          if-no-files-found: error
          retention-days: 30
