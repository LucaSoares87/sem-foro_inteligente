name: PIMCAT I2B synthetic camera resilience
on:
  pull_request:
    paths:
      - 'backend/src/benchmarking/pimcat_i2b_resilience.py'
      - 'backend/tests/test_pimcat_i2b_resilience.py'
      - 'docs/pimcat/i2b-resilience-protocol.md'
      - '.github/workflows/pimcat-i2b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resilience:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing runtime
        run: |
          python -m pip install -r backend/requirements-dev.txt
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          mkdir -p /tmp/i2b
          python -m pip freeze > /tmp/i2b/environment.txt
          ffmpeg -version > /tmp/i2b/ffmpeg.txt
      - name: Start local-only fixture
        run: |
          docker run --rm -d --name pimcat-i2b-rtsp -p 127.0.0.1:18554:8554/tcp -e MTX_RTSPTRANSPORTS=tcp bluenviron/mediamtx:1.12.3
          docker image inspect bluenviron/mediamtx:1.12.3 --format '{{json .RepoDigests}}' > /tmp/i2b/server-digest.json
      - name: Original H1 and aggregate regression
        working-directory: backend
        env:
          PIMCAT_H1_RTSP_REQUIRED: '1'
          PIMCAT_H1_REPORT: /tmp/i2b/h1.json
        run: python -m pytest -q tests/test_video.py tests/test_pimcat_h1_gateway.py tests/test_pimcat_i2b_resilience.py --junitxml=/tmp/i2b/tests.xml
      - name: Run bounded 180-second campaign
        working-directory: backend
        run: python -m src.benchmarking.pimcat_i2b_resilience --profile ci --output /tmp/i2b/study.json
      - name: Stop local fixture
        if: always()
        run: docker rm -f pimcat-i2b-rtsp || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pimcat-i2b-resilience-evidence
          path: /tmp/i2b/
          retention-days: 30
