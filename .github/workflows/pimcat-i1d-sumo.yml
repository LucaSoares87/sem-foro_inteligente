name: PIMCAT I1G prospective replication
on:
  workflow_dispatch:
    inputs:
      approved:
        description: Authorize one frozen I1G replication
        type: boolean
        default: false
      reviewed_sha:
        description: Reviewed full release commit SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  replicate:
    if: github.event_name == 'workflow_dispatch' && inputs.approved && inputs.reviewed_sha == github.sha && github.ref == 'refs/heads/research/pimcat-i1g-replication' && github.run_attempt == 1 && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
          cache: ''
      - name: Stage the 42 exact wheels and verify their published bytes
        working-directory: research/i1g-wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          echo '2357835c3f6dba81ab99fb06df53a49501632ca7b83bd39b49185f38d370ecfc  I1G-cp312-linux-x86_64.lock' | sha256sum -c -
          mkdir "$RUNNER_TEMP/wheelhouse"
          python - <<'PY'
          import json
          import os
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from verify import verify
          rows = json.loads(Path("inventory.json").read_text())
          directory = Path(os.environ["RUNNER_TEMP"]) / "wheelhouse"
          with ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(lambda row: verify(row, directory), rows))
          assert len(list(directory.glob("*.whl"))) == len(rows) == 42
          print("Verified and staged 42 wheels")
          PY
      - name: Prepare reviewed frozen release
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: python research/i1g-replication/prepare.py "$RUNNER_TEMP/release"
      - name: Install offline and run the bounded campaign
        working-directory: research/i1g-wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- runuser -u "$(id -un)" -- bash -euo pipefail -s -- "$(command -v python)" "$RUNNER_TEMP" "$GITHUB_SHA" "$GITHUB_REF_NAME" <<'OFFLINE'
          "$1" -m venv "$2/i1g-venv"
          py="$2/i1g-venv/bin/python"
          "$py" -VV
          "$py" -m pip --version
          "$py" -m pip --isolated --disable-pip-version-check install --no-cache-dir --no-index --only-binary=:all: --require-hashes --find-links "$2/wheelhouse" -r I1G-cp312-linux-x86_64.lock
          "$py" -m pip --isolated --disable-pip-version-check check
          "$py" - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path
          rows = json.loads(Path("inventory.json").read_text())
          for row in rows:
              assert version(row["name"]) == row["version"], row["name"]
          print("I1G OFFLINE INSTALL PASS: 42/42 installed versions match")
          PY
          export PATH="$2/i1g-venv/bin:$PATH"
          SUMO_HOME=$("$py" -c 'import sumo; print(sumo.SUMO_HOME)')
          export SUMO_HOME
          netconvert --version
          cd "$2/release"
          export GITHUB_SHA="$3" GITHUB_REF_NAME="$4" GITHUB_ACTIONS=true
          "$py" -m pip freeze > environment.txt
          timeout -k 2s 120s "$py" replication_executor.py --execute-authorized --approval approval.json --target-junit proofs/target-original.xml --output campaign
          OFFLINE
      - name: Preserve complete or partial observations
        if: always()
        env:
          RELEASE: ${{ runner.temp }}/release
        shell: python
        run: |
          import base64, hashlib, os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path(os.environ["RELEASE"])
          output = root.parent / "replication.zip"
          with ZipFile(output, "w", ZIP_DEFLATED) as z:
              for name in ("approval.json", "environment.txt", "replication-plan.json"):
                  if (root / name).is_file():
                      z.write(root / name, name)
              for p in sorted((root / "campaign").rglob("*")):
                  if p.is_file():
                      z.write(p, p.relative_to(root))
          data = output.read_bytes()
          print("REPLICATION_SHA256", hashlib.sha256(data).hexdigest())
          for i in range(0,len(data),3000):
              print("REPLICATION_DATA", base64.b64encode(data[i:i+3000]).decode())
