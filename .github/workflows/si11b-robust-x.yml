name: SI-11B robust X
on:
  pull_request:
    paths:
      - 'backend/src/benchmarking/si11b_robust_x.py'
      - 'backend/tests/test_si11b_robust_x.py'
      - '.github/workflows/si11b-robust-x.yml'
      - 'docs/si11/robust-x-protocol.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  robust-study:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing research runtime
        run: python -m pip install -r requirements-dev.txt
      - name: Validate robust X and frozen SI-11A regression
        run: python -m pytest -q tests/test_si11b_robust_x.py tests/test_si11_counterfactual.py
      - name: Execute pre-registered study
        run: |
          mkdir -p /tmp/si11b-results
          python -m src.benchmarking.si11b_robust_x --output /tmp/si11b-results/robust-x.json
      - name: Verify evidence and research boundaries
        run: |
          python - <<'PY'
          import json
          from src.archive.store import fingerprint
          d=json.load(open('/tmp/si11b-results/robust-x.json'))
          b=dict(d); sha=b.pop('result_sha256')
          assert sha==fingerprint(b)
          assert d['scope']=='synthetic_robust_x_not_field'
          assert d['seeds']==list(range(1000,1040))
          assert len(d['cases'])==640 and sum(len(c['metrics']) for c in d['cases'])==3840
          assert d['low_confidence_abstention_verified']
          assert d['research_gate_passed']==all(c['all_research_gates_met'] for c in d['cohorts'].values())
          assert all(d[k] is False for k in ('candidate_promoted','x_validated_for_real_traffic','commercial_demo_authorized','operationally_validated','physical_actuation'))
          print(json.dumps({'research_gate_passed':d['research_gate_passed'],'cohorts':d['cohorts']},indent=2))
          PY
      - name: Preserve full synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: si11b-robust-x-evidence
          path: /tmp/si11b-results/robust-x.json
          if-no-files-found: error
          retention-days: 30
