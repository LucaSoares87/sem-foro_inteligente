services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traffic}
      POSTGRES_USER: ${POSTGRES_USER:-traffic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [database]
  migrate:
    build: ./backend
    environment: &backend-env
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-traffic}
      POSTGRES_USER: ${POSTGRES_USER:-traffic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    command: ["alembic","upgrade","head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      VIDEO_SOURCES_JSON: ${VIDEO_SOURCES_JSON:-[]}
      VIDEO_ROOT: /media/video
      VISION_MODEL_JSON: ${VISION_MODEL_JSON:-}
      VISION_MODEL_ROOT: /media/models
      TRAFFIC_GEOMETRY_JSON: ${TRAFFIC_GEOMETRY_JSON:-[]}
      INTERSECTION_REGISTRY_JSON: ${INTERSECTION_REGISTRY_JSON:-[]}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=6)"]
      interval: 10s
      timeout: 8s
      retries: 6
    networks: [database, application]
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 8s
      retries: 6
    networks: [application]
volumes:
  pgdata:
networks:
  database:
    internal: true
  application:
