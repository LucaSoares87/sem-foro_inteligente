services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traffic}
      POSTGRES_USER: ${POSTGRES_USER:-traffic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}
    pids_limit: 256
    stop_grace_period: 30s
    networks: [database]
  migrate:
    build: ./backend
    environment: &backend-env
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-traffic}
      POSTGRES_USER: ${POSTGRES_USER:-traffic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      AUTH_MODE: ${AUTH_MODE:-disabled}
      AUTH_USER_HEADER: ${AUTH_USER_HEADER:-x-si-user}
      AUTH_ROLES_HEADER: ${AUTH_ROLES_HEADER:-x-si-roles}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
    command: ["alembic","upgrade","head"]
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MIGRATE_MEMORY_LIMIT:-512m}
    cpus: ${MIGRATE_CPU_LIMIT:-1.0}
    pids_limit: 128
    networks: [database]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      VIDEO_SOURCES_JSON: ${VIDEO_SOURCES_JSON:-[]}
      VIDEO_ROOT: /media/video
      VISION_MODEL_JSON: ${VISION_MODEL_JSON:-}
      VISION_MODEL_ROOT: /media/models
      TRAFFIC_GEOMETRY_JSON: ${TRAFFIC_GEOMETRY_JSON:-[]}
      INTERSECTION_REGISTRY_JSON: ${INTERSECTION_REGISTRY_JSON:-[]}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=6)"]
      interval: 10s
      timeout: 8s
      retries: 6
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2g}
    cpus: ${BACKEND_CPU_LIMIT:-2.0}
    pids_limit: 256
    stop_grace_period: 30s
    networks: [database, application]
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 8s
      retries: 6
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${FRONTEND_CPU_LIMIT:-1.0}
    pids_limit: 128
    stop_grace_period: 15s
    networks: [application]
volumes:
  pgdata:
networks:
  database:
    internal: true
  application:
