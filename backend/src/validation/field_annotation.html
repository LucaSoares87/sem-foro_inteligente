<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>C3 — anotação privada</title>
<style>body{font:16px system-ui;background:#101827;color:#f1f5f9;margin:16px auto;max-width:1100px;padding:0 12px}button,input{font:inherit;padding:9px;margin:4px}button:disabled{opacity:.5}canvas{width:100%;height:auto;touch-action:none;background:#111;display:block}p{line-height:1.5}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:4px}strong{color:#93c5fd}</style>
<h1>C3 — anotação independente</h1><p>Arquivo privado, sem rede. Desenhe uma caixa para cada pessoa visível. Marque o frame revisado explicitamente, inclusive quando não houver pessoas. Não consulte saídas do modelo nem a outra ficha. Exporte antes de fechar; não há armazenamento automático.</p>
<label>Referência privada do anotador <input id="annotator" maxlength="240" autocomplete="off"></label><p id="status" aria-live="polite"></p>
<canvas id="canvas" width="1280" height="720" aria-label="Frame para anotação"></canvas>
<div class="controls"><button id="prev">Anterior</button><button id="next">Próximo</button><button id="undo">Desfazer última caixa</button><button id="clear">Limpar caixas</button><button id="review">Marcar revisado (inclusive zero)</button><button id="export" disabled>Exportar ficha JSON</button></div>
<script>"use strict";const data=__PRIVATE_PAYLOAD__;const rows=data.reference.frames.map(r=>({...r,boxes:[]}));const by=id=>document.getElementById(id);const canvas=by("canvas"),ctx=canvas.getContext("2d");let index=0,start=null,image=null,loaded=false,version=0;
function draw(temp){ctx.clearRect(0,0,1280,720);if(!loaded)return;ctx.drawImage(image,0,0);ctx.strokeStyle="#00ff9c";ctx.lineWidth=3;for(const [x,y,u,v] of [...rows[index].boxes,...(temp?[temp]:[])])ctx.strokeRect(x*1280,y*720,(u-x)*1280,(v-y)*720)}
function update(){const r=rows[index],n=rows.filter(x=>x.reviewed).length;by("status").textContent="Frame "+r.frame+" · "+(index+1)+"/"+rows.length+" · "+r.boxes.length+" caixas · "+(r.reviewed?"revisado":"não revisado")+" · "+n+" revisados";by("prev").disabled=index===0;by("next").disabled=index===rows.length-1;by("review").disabled=!loaded;by("export").disabled=n!==rows.length||!by("annotator").value.trim()}
function load(){const token=++version;loaded=false;start=null;draw();update();const next=new Image();next.onload=()=>{if(token!==version)return;image=next;loaded=true;draw();update()};next.src="data:image/png;base64,"+data.images[index]}
function point(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}
function box(a,b){return [Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.max(a[0],b[0]),Math.max(a[1],b[1])]}
canvas.onpointerdown=e=>{if(!loaded||start)return;start=point(e);canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(start)draw(box(start,point(e)))};canvas.onpointercancel=()=>{start=null;draw()};canvas.onpointerup=e=>{if(!start)return;const b=box(start,point(e));start=null;if(b[2]>b[0]&&b[3]>b[1]&&!rows[index].boxes.some(x=>JSON.stringify(x)===JSON.stringify(b))){rows[index].boxes.push(b);rows[index].reviewed=false}draw();update()};
by("prev").onclick=()=>{if(index>0){index--;load()}};by("next").onclick=()=>{if(index<rows.length-1){index++;load()}};by("undo").onclick=()=>{rows[index].boxes.pop();rows[index].reviewed=false;draw();update()};by("clear").onclick=()=>{if(confirm("Limpar caixas deste frame?")){rows[index].boxes=[];rows[index].reviewed=false;draw();update()}};by("review").onclick=()=>{if(loaded){rows[index].reviewed=true;update()}};by("annotator").oninput=update;
by("export").onclick=()=>{const annotator=by("annotator").value.trim();if(!annotator||!rows.every(r=>r.reviewed))return;const doc={...data.reference,status:"REVIEWED",annotator_ref:annotator,frames:rows};const url=URL.createObjectURL(new Blob([JSON.stringify(doc,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download="c3-annotation.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};load();</script></html>
